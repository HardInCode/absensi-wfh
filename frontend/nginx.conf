server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Foto maks 3 MB + overhead multipart. Default Nginx (1 MB) akan menolak upload.
  client_max_body_size 4m;

  # DNS internal Docker; upstream di-resolve saat request (Nginx tetap bisa start
  # walau gateway sedang restart).
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $gateway http://api-gateway:3000;
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Ditimpa (bukan ditambah) agar klien tidak bisa memalsukan IP untuk rate limit.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback untuk React Router
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

